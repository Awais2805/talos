# CIC-IDS-2017 — ground-truth label manifest
# Transcribed 2026-07-26 from the official CIC dataset page (attack schedule,
# victim/attacker network tables). Times below are LOCAL wall-clock.
#
# !! utc_offset IS AN INFERENCE, NOT A TRANSCRIPTION. Verified 2026-07-30 against
# the CIC page and the ICISSP 2018 paper: neither states a timezone anywhere --
# no "UTC", no "ADT", no offset. -03:00 is inferred from CIC being in Fredericton
# and the capture running in July (ADT), and it is consistent with the DistriNet
# CNS2022 audit's UTC conversions, but no primary source supports it. Because
# every label derives from a wall-clock -> epoch conversion, an offset error
# moves every window in this dataset together while leaving the labelled output
# looking complete. sch.offset_calibration exists to pin this empirically; treat
# it as unconfirmed until that check has run against the lake.
#
# NAT note: external attacks traverse the firewall
# (205.174.165.73 -> 205.174.165.80 -> 172.16.0.1 -> victim), so depending on
# capture point the attacker may appear as 205.174.165.73 OR 172.16.0.1.
# Both are listed; match on either. Victims include internal + public IPs.

dataset: cic-ids-2017
utc_offset: "-03:00"
capture_window: 2017-07-03 to 2017-07-07 (Mon benign-only)
match_default: [time, attacker, victim]

aliases:
  kali: &kali [205.174.165.73, 172.16.0.1]
  webserver: &webserver [192.168.10.50, 205.174.165.68]
  ubuntu12: &ubuntu12 [192.168.10.51, 205.174.165.66]

attacks:
  # ---- Tuesday 2017-07-04 ----
  - {name: FTP-Patator, date: 2017-07-04, start: "09:20", end: "10:20",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: SSH-Patator, date: 2017-07-04, start: "14:00", end: "15:00",
     attacker_ips: *kali, victim_ips: *webserver}

  # ---- Wednesday 2017-07-05 ----
  - {name: DoS-Slowloris,    date: 2017-07-05, start: "09:47", end: "10:10",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: DoS-Slowhttptest, date: 2017-07-05, start: "10:14", end: "10:35",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: DoS-Hulk,         date: 2017-07-05, start: "10:43", end: "11:00",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: DoS-GoldenEye,    date: 2017-07-05, start: "11:10", end: "11:23",
     attacker_ips: *kali, victim_ips: *webserver}
  # CIC's NAT chain for THIS attack reads "... -> 172.16.0.11 -> 192.168.10.51"
  # (.11, not the .1 used everywhere else). Almost certainly a typo — the reply
  # path in the same paragraph uses .1 — but both are listed so a post-NAT
  # capture matches either way. Time + victim still constrain the rule.
  - {name: Heartbleed, date: 2017-07-05, start: "15:12", end: "15:32",
     attacker_ips: [205.174.165.73, 172.16.0.1, 172.16.0.11],
     victim_ips: *ubuntu12, note: "port 444"}

  # ---- Thursday 2017-07-06 (morning: web attacks) ----
  - {name: WebAttack-BruteForce,    date: 2017-07-06, start: "09:20", end: "10:00",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: WebAttack-XSS,          date: 2017-07-06, start: "10:15", end: "10:35",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: WebAttack-SQLInjection, date: 2017-07-06, start: "10:40", end: "10:42",
     attacker_ips: *kali, victim_ips: *webserver}

  # ---- Thursday 2017-07-06 (afternoon: infiltration) ----
  # !! THIS WINDOW IS WIDER THAN ANYTHING CIC PUBLISHES — pending adjudication.
  # CIC's detail line reads "(14:19 and 14:20-14:21) and (14:33-14:35)" and that
  # is the ONLY form on the page. An earlier revision of this comment claimed the
  # page also summarises it as a single 14:19-14:35 block; source verification on
  # 2026-07-30 found no such summary line, and the ICISSP paper publishes no times
  # at all ("the details of the attack timing will be published on the dataset
  # document"). That justification was wrong and is withdrawn.
  #
  # What remains true is the traffic evidence: the Vista<->Kali callback (port
  # 444) sits at ~14:28-14:30, inside the gap between CIC's two sub-windows, and
  # the 14:33-14:35 window is empty. So the contiguous span is defended by the
  # capture, not by the document -- but it currently labels 14:22-14:32 as attack
  # on no published basis. sch.window_sweep over the three documented sub-windows
  # is what should settle whether the span stays; until then this is a known
  # over-reach, recorded rather than quietly kept.
  #
  # Note also that CIC's Thursday sub-times (14:20-14:21, 14:33, 14:35) appear
  # byte-identical in Friday's PortScan list, including the degenerate
  # "14:33 - 14:33" and "14:35 - 14:35" entries -- probable copy-paste
  # contamination in CIC's own documentation. Treat both lists as low-confidence
  # around these minutes.
  - {name: Infiltration, date: 2017-07-06, start: "14:19", end: "14:35",
     attacker_ips: *kali, victim_ips: [192.168.10.8], note: "metasploit Win Vista"}
  - {name: Infiltration, date: 2017-07-06, start: "14:53", end: "15:00",
     attacker_ips: *kali, victim_ips: [192.168.10.25], note: "cool disk MAC"}
  - {name: Infiltration, date: 2017-07-06, start: "15:04", end: "15:45",
     attacker_ips: *kali, victim_ips: [192.168.10.8], note: "dropbox download Vista"}
  # CIC calls this "Second Step (Portscan + Nmap)" of the Infiltration scenario:
  # the compromised Vista box scans "All other clients". The raw name keeps that
  # provenance; the taxonomy maps it to canonical `portscan` because the traffic
  # IS scanning (12 hosts / 1,105 dst ports in 41 min), and because 2018's
  # equivalent second step is not labellable from its schedule. Classing this as
  # `infiltration` would leave that class meaning "internal scanning" in 2017 and
  # "external exploit" in 2018, which would make cross-domain evaluation of it
  # meaningless.
  #
  # CORRECTED 2026-07-31. This comment previously said CIC "never publishes the
  # infected host's IP" for 2018. That is wrong: CIC does publish it, in Table
  # 2's Victim column (172.31.69.24 on 28-02, 172.31.69.13 on 01-03), and those
  # hosts are the ones that go on to scan. What CIC withholds for 2018 is the
  # scan TARGETS and a separate window for the phase, which is what actually
  # makes it unlabellable. 2017 is the labellable case precisely because both
  # halves are published — the scanner below and its /24 of targets. See
  # docs/label_evidence.md A3; 2018's four quarantine regions cover those windows
  # so the flows are label_quality='uncertain' rather than silently benign.
  - {name: Infiltration-PortScan, date: 2017-07-06, start: "15:04", end: "15:45",
     attacker_ips: [192.168.10.8], victim_subnet: "192.168.10.0/24",
     note: "second step: infected Vista portscans the LAN"}

  # ---- Friday 2017-07-07 ----
  - {name: Botnet-ARES, date: 2017-07-07, start: "10:02", end: "11:02",
     attacker_ips: *kali,
     victim_ips: [192.168.10.15, 192.168.10.9, 192.168.10.14, 192.168.10.5, 192.168.10.8]}
  # PortScan: schedule lists many 1-3 min sub-windows; coarse windows used here.
  # Firewall rules ON sub-windows: 13:55-13:57, 13:58-14:00, 14:01-14:04, 14:05-14:07,
  #   14:08-14:10, 14:11-14:13, 14:14-14:16, 14:17-14:19, 14:20-14:21, 14:22-14:24,
  #   14:33-14:33, 14:35-14:35
  - {name: PortScan, date: 2017-07-07, start: "13:55", end: "14:36",
     attacker_ips: *kali, victim_ips: *webserver, note: "firewall rules on; coarse window"}
  # Firewall rules OFF sub-windows (nmap scan types sS..sI, b): 14:51 - 15:29
  - {name: PortScan, date: 2017-07-07, start: "14:51", end: "15:29",
     attacker_ips: *kali, victim_ips: *webserver, note: "firewall rules off; coarse window"}
  # The three Win 8.1 attackers sit outside the firewall, so inside the capture
  # they all appear post-NAT as 172.16.0.1 (CIC documents the same chain:
  # 205.174.165.69/70/71 -> 205.174.165.80 -> 172.16.0.1). Without the alias
  # this rule matched ZERO flows while 94,614 sat in the window.
  - {name: DDoS-LOIT, date: 2017-07-07, start: "15:56", end: "16:16",
     attacker_ips: [205.174.165.69, 205.174.165.70, 205.174.165.71, 172.16.0.1],
     victim_ips: *webserver}
