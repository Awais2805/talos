# Talos — canonical attack taxonomy
# Maps every raw attack name used in the per-dataset manifests to one
# canonical class. Cross-domain evaluation is only meaningful when all
# datasets share these classes.

canonical_classes:
  benign:       traffic not matched by any attack rule in a labelled capture
  brute_force:  credential guessing against a network service (FTP/SSH/etc.)
  dos:          single-source denial of service
  ddos:         distributed / reflected-amplified denial of service
  web_attack:   attacks on web applications (brute force login, XSS, SQLi)
  heartbleed:   OpenSSL heartbeat memory-disclosure exploitation
  infiltration: exploitation + inside-out activity (backdoor, internal scan)
  botnet:       C2 traffic between bot-infected hosts and controller
  portscan:     port / service reconnaissance

# Attacks whose execution REQUIRES the attacker to send payload. A flow matched
# by time+endpoints but carrying zero forward bytes is then a connection attempt,
# not an executed attack, and is marked label_executed=false rather than being
# silently counted as a successful attack.
#
# Following Engelen, Rimmer & Joosen, "Troubleshooting an Intrusion Detection
# Dataset: the CICIDS2017 Case Study" (WTMC 2021), who show that labelling on
# time+IP alone counts empty and failed TCP connections as executed attacks.
# Independently reproduced on our Zeek extraction: 2017 WebAttack-BruteForce is
# 1,213/1,356 empty and WebAttack-XSS 652/679.
#
# Deliberately EXCLUDED are attacks where an empty connection IS the mechanism --
# port scans, slow-DoS (Slowloris/SlowHTTPTest hold sockets open by sending
# almost nothing), SYN floods and UDP reflection. Marking those "attempted"
# would discard real attack traffic.
requires_payload:
  - FTP-Patator
  - SSH-Patator
  - FTP-BruteForce
  - SSH-Bruteforce
  - WebAttack-BruteForce
  - WebAttack-XSS
  - WebAttack-SQLInjection
  - BruteForce-Web
  - BruteForce-XSS
  - SQL-Injection
  - Botnet-ARES
  - Bot
  - Infiltration
  - Heartbleed
  - DoS-Hulk
  - DoS-GoldenEye
  - DDoS-LOIT
  - DDoS-LOIC-HTTP
  - DDoS-HOIC

raw_to_canonical:
  # cic-ids-2017
  FTP-Patator: brute_force
  SSH-Patator: brute_force
  DoS-Slowloris: dos
  DoS-Slowhttptest: dos
  DoS-Hulk: dos
  DoS-GoldenEye: dos
  Heartbleed: heartbleed
  WebAttack-BruteForce: web_attack
  WebAttack-XSS: web_attack
  WebAttack-SQLInjection: web_attack
  Infiltration: infiltration
  # CIC's "Second Step (Portscan + Nmap)" of the 2017 infiltration scenario.
  # Behaviourally a scan, so it classes with portscan; the raw name preserves
  # which scenario it came from. Keeps `infiltration` comparable across datasets.
  Infiltration-PortScan: portscan
  Botnet-ARES: botnet
  PortScan: portscan
  DDoS-LOIT: ddos
  # cic-ids-2018
  FTP-BruteForce: brute_force
  SSH-Bruteforce: brute_force
  DoS-SlowHTTPTest: dos
  DDoS-LOIC-HTTP: ddos
  DDoS-LOIC-UDP: ddos
  DDoS-HOIC: ddos
  BruteForce-Web: web_attack     # DVWA login brute force -> web attack, not brute_force
  BruteForce-XSS: web_attack
  SQL-Injection: web_attack
  Bot: botnet
  # cic-ddos-2019 (all reflection/exploitation DDoS except recon)
  PortMap: ddos
  NetBIOS: ddos
  LDAP: ddos
  MSSQL: ddos
  UDP: ddos
  UDP-Lag: ddos
  SYN: ddos
  NTP: ddos
  DNS: ddos
  SNMP: ddos
  SSDP: ddos
  WebDDoS: ddos
  TFTP: ddos
