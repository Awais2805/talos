# CSE-CIC-IDS-2018 — ground-truth label manifest
# Transcribed 2026-07-26 from the official dataset page, Table 2 ("List of
# daily attacks, Machine IPs, Start and finish time of attack(s)").
# Times below are LOCAL wall-clock.
#
# !! utc_offset IS AN INFERENCE, NOT A TRANSCRIPTION. Verified 2026-07-30 against
# the CIC page and the ICISSP 2018 paper: neither states a timezone anywhere --
# no "UTC", no "AST", no "Atlantic", no numeric offset. An earlier revision of
# this header read "Times are LOCAL (Fredericton, AST in Feb/Mar). UTC = local +
# 4h", which asserted as transcription something no primary source publishes;
# that claim is withdrawn. -04:00 is inferred, from CIC being in Fredericton and
# the capture running in February/March, when Atlantic time is AST.
#
# That inference is WEAKER here than it is for 2017, and it is worth being clear
# about why rather than carrying the same footnote twice. This testbed did not
# run in Fredericton. It ran on AWS (see the AWS note below), and a capture clock
# on a cloud host follows that host's own configuration, not the location of the
# people driving it. Nothing published says what those instances were set to, so
# the single piece of reasoning behind -04:00 -- where CIC is -- does not reach
# the machines that actually wrote these timestamps. Read this offset with less
# confidence than 2017's, not the same.
#
# The consequence is the same in both datasets and is what makes this the
# highest-consequence line in the file: every label derives from a wall-clock ->
# epoch conversion, so an offset error moves every window in this dataset
# together, in the same direction, by the same amount -- while the labelled
# output still looks complete, every rule still fires, and every class still has
# a plausible count. sch.offset_calibration exists to pin this empirically, by
# sliding the short sharp rules against the traffic they claim and reporting the
# shift that fits; a whole-hour shift agreed by several independent rules is a
# clock error rather than a transcription error, and would condemn every window
# here at once. Treat -04:00 as unconfirmed until that check has run against the
# lake. Evidence: docs/label_evidence.md A1.
#
# AWS note: testbed ran on AWS; machines have an internal VPC IP (172.31.x.x)
# and a public "valid IP" (18.x / 13.x / 52.x). Depending on capture point a
# host may appear under either — both are listed; match on either.
# Table 2 contains one duplicated Infiltration row (01-03 14:00-15:37),
# transcribed once.

dataset: cic-ids-2018
utc_offset: "-04:00"            # INFERRED, not transcribed — see the header
capture_window: 2018-02-14 to 2018-03-02 (weekdays)
match_default: [time, attacker, victim]

aliases:
  victim_srv1: &v1 [172.31.69.25, 18.217.21.148]
  victim_srv2: &v2 [172.31.69.28, 18.218.83.150]
  loic_attackers: &loic
    [18.218.115.60, 18.219.9.1, 18.219.32.43, 18.218.55.126, 52.14.136.135,
     18.219.5.43, 18.216.200.189, 18.218.229.235, 18.218.11.51, 18.216.24.42]
  bot_victims: &botv
    [172.31.69.23, 18.217.218.111, 172.31.69.17, 18.222.10.237,
     172.31.69.14, 18.222.86.193, 172.31.69.12, 18.222.62.221,
     172.31.69.10, 13.59.9.106,   172.31.69.8,  18.222.102.2,
     172.31.69.6,  18.219.212.0,  172.31.69.26, 18.216.105.13,
     172.31.69.29, 18.219.163.126, 172.31.69.30, 18.216.164.12]

