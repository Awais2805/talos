  # KNOWN GAP — SECOND-STAGE INFILTRATION. CIC describes this scenario as two
  # levels: "First level: Dropbox download in a windows machine. Second Level:
  # Nmap and portscan". The four rules below cover the first level only.
  #
  # What CIC publishes, corrected. An earlier revision of this comment said CIC
  # "never names the infected host". That is FALSE and is withdrawn: Table 2
  # names it, in the Victim column, on both days —
  #     2018-02-28  172.31.69.24  (public 18.221.148.137)
  #     2018-03-01  172.31.69.13  (public 18.216.254.154)
  # and those are the same hosts that go on to run the internal Nmap sweep. They
  # are already written into the victim_ips of the rules below, so the scanner's
  # address is not missing from this manifest and never was. What Table 2 does
  # NOT publish is the second stage's TARGETS — no scanned subnet, no host list —
  # and no separate start/finish time for the phase.
  # Evidence: docs/label_evidence.md A3.
  #
  # That is what makes the phase unlabellable rather than merely undocumented.
  # 2017's equivalent second step IS labelled (Infiltration-PortScan -> canonical
  # `portscan`) precisely because CIC gives both halves there: the infected Vista
  # box AND the 192.168.10.0/24 it scans. Here we have the scanner and nothing to
  # constrain it with, and a rule naming only a scanner inside a window would
  # claim every flow that host sent for the duration — which on an AWS testbed is
  # its own management traffic as much as its scan.
  #
  # DEFERRED, not forgotten. The plan of record was to add second-stage rules
  # with windows pinned by measurement. sch.window_sweep has NOT yet run against
  # this dataset, so there is nothing to pin them to, and inventing windows here
  # would put a transcription-shaped fact in a file whose whole contract is that
  # everything in it was transcribed. The hypothesis to be TESTED when the sweep
  # runs, recorded here so it is falsifiable rather than assumed:
  #     DistriNet (CNS2022) derive the two phases as running to 18:39 (28-02) and
  #     19:38 (01-03), against CIC's published finishes of 14:40 and 15:37 — some
  #     four hours of activity past the schedule on each day.
  # Those two times are a THIRD PARTY'S DERIVATION, not a CIC publication and not
  # a measurement of our lake. They are the prediction the sweep should confirm
  # or refute against our own traffic before any window is written from them.
  # Copying them in as fact would import someone else's inference wearing the
  # costume of a transcription, which is the exact failure this manifest's
  # utc_offset header was rewritten to stop us repeating.
  #
  # Meanwhile these flows are NOT silently benign. All four windows below are
  # declared unadjudicable in the `quarantine:` block at the foot of this file,
  # so every flow inside them — the 8 the rules match and the ~175,000 per
  # 10-minute bucket they do not — carries label_quality = 'uncertain' and is
  # excluded from training and evaluation pools rather than certified benign by
  # the closed-world assumption. The gap is therefore recorded and costed, not
  # papered over; what is still owed is the sweep, and after it either real
  # second-stage rules or a written finding that the phase cannot be recovered.
  - {name: Infiltration, date: 2018-02-28, start: "10:50", end: "12:05",
     attacker_ips: [13.58.225.34], victim_ips: [172.31.69.24, 18.221.148.137]}
  - {name: Infiltration, date: 2018-02-28, start: "13:42", end: "14:40",
     attacker_ips: [13.58.225.34], victim_ips: [172.31.69.24, 18.221.148.137]}
  - {name: Infiltration, date: 2018-03-01, start: "09:57", end: "10:55",
     attacker_ips: [13.58.225.34], victim_ips: [172.31.69.13, 18.216.254.154]}
  - {name: Infiltration, date: 2018-03-01, start: "14:00", end: "15:37",
     attacker_ips: [13.58.225.34], victim_ips: [172.31.69.13, 18.216.254.154]}

  - {name: Bot, date: 2018-03-02, start: "10:11", end: "11:34",
     attacker_ips: [18.219.211.138], victim_ips: *botv}
  - {name: Bot, date: 2018-03-02, start: "14:24", end: "15:55",
     attacker_ips: [18.219.211.138], victim_ips: *botv}

# ---------------------------------------------------------------------------
# QUARANTINE — regions we decline to adjudicate
#
# Flows inside these regions keep the label the schedule gives them but are
# marked label_quality = 'uncertain' and excluded from training and evaluation
# pools. The regions are declared here, like the attack windows, so a reader can
# see every span we have withdrawn and why; none of it is inferred from traffic.
quarantine_justifications:
  unlabellable_second_stage: &second_stage >
    CIC describes Infiltration as two stages — "First level: Dropbox download in
    a windows machine. Second Level: Nmap and portscan" — and Table 2 publishes
    only the first. It names the infected host in the Victim column
    (172.31.69.24 on 28-02, 172.31.69.13 on 01-03), but never the scan targets
    and never a separate window for the second stage. The internal scan is
    therefore unlabellable from the schedule: we cannot say which flows it
    produced, so every one of them falls to benign by the closed-world
    assumption. That default is not neutral here. The attack rules match 8 flows
    across roughly 4.5 scheduled hours, while these windows carry on the order of
    175,000 unmatched flows per 10-minute bucket — a benign class certified by
    nothing but the absence of a published target list.
    The 8 matched flows are no better founded than the unmatched ones: none of
    them completed a connection (conn_state OTH 50% / S1 37.5% / RSTR 12.5%) and
    the longest runs 13,254.7 s against a 5,820 s window, a 2.28x overrun, so
    they are mid-stream traffic caught by a time window rather than an observed
    attack (B11). They sit inside these regions and are quarantined with
    everything else; `infiltration` therefore carries no adjudicable evidence in
    this dataset and must not be evaluated as a class (B10).
    DistriNet derives the two phases as running to 18:39 and 19:38, far past
    CIC's published 14:40 and 15:37, so even as declared these regions
    UNDER-cover the phase (A3). They are drawn at the published times because
    those are what the source states; the DistriNet finding is why the region
    cannot be read as an upper bound on the contamination. Widening them, or
    replacing them with real second-stage attack rules, is DEFERRED until
    sch.window_sweep has measured where this traffic actually stops in our own
    lake: the DistriNet end times are a third party's derivation and are recorded
    as the hypothesis that sweep should test, never as a transcribed fact.
    Scoped to the hosts CIC does name, so the rest of each day — which the
    schedule describes normally — stays adjudicated.
    These regions coincide with the four scheduled Infiltration windows by
    construction, so qtn.overlap_with_attack reports them: we are declining to
    adjudicate a span the schedule claims. That contradiction is real and this
    is its answer — the schedule's claim here amounts to 8 unfinished flows and
    accounts for none of the rest.

quarantine:
  - {reason: unlabellable-second-stage, justification: *second_stage,
     date: 2018-02-28, start: "10:50", end: "12:05",
     victim_ips: [172.31.69.24, 18.221.148.137]}
  - {reason: unlabellable-second-stage, justification: *second_stage,
     date: 2018-02-28, start: "13:42", end: "14:40",
     victim_ips: [172.31.69.24, 18.221.148.137]}
  - {reason: unlabellable-second-stage, justification: *second_stage,
     date: 2018-03-01, start: "09:57", end: "10:55",
     victim_ips: [172.31.69.13, 18.216.254.154]}
  - {reason: unlabellable-second-stage, justification: *second_stage,
     date: 2018-03-01, start: "14:00", end: "15:37",
     victim_ips: [172.31.69.13, 18.216.254.154]}
