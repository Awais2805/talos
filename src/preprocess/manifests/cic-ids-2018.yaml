  # KNOWN GAP: CIC describes this scenario as two levels — "First level: Dropbox
  # download in a windows machine. Second Level: Nmap and portscan" — but Table 2
  # publishes IPs only for the external phase and never names the infected host
  # that performs the internal scan. That second step is therefore unlabellable
  # from the official schedule and falls to benign under the closed-world
  # assumption: a documented false-negative forced by the source, not by method.
  # (2017 publishes the infected host, so its second step IS labelled — as
  # Infiltration-PortScan -> canonical `portscan`.)
