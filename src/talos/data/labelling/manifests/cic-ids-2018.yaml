# ---------------------------------------------------------------------------
# QUARANTINE — regions we decline to adjudicate
#
# Flows inside these regions keep the label the schedule gives them but are
# marked label_quality = 'uncertain' and excluded from training and evaluation
# pools. The regions are declared here, like the attack windows, so a reader can
# see every span we have withdrawn and why; none of it is inferred from traffic.
quarantine_justifications:
  unlabellable_second_stage: &second_stage >
    CIC describes Infiltration as two stages — "First level: Dropbox download in
    a windows machine. Second Level: Nmap and portscan" — and Table 2 publishes
    only the first. It names the infected host in the Victim column
    (172.31.69.24 on 28-02, 172.31.69.13 on 01-03), but never the scan targets
    and never a separate window for the second stage. The internal scan is
    therefore unlabellable from the schedule: we cannot say which flows it
    produced, so every one of them falls to benign by the closed-world
    assumption. That default is not neutral here. The attack rules match 8 flows
    across roughly 4.5 scheduled hours, while these windows carry on the order of
    175,000 unmatched flows per 10-minute bucket — a benign class certified by
    nothing but the absence of a published target list.
    The 8 matched flows are no better founded than the unmatched ones: none of
    them completed a connection (conn_state OTH 50% / S1 37.5% / RSTR 12.5%) and
    the longest runs 13,254.7 s against a 5,820 s window, a 2.28x overrun, so
    they are mid-stream traffic caught by a time window rather than an observed
    attack (B11). They sit inside these regions and are quarantined with
    everything else; `infiltration` therefore carries no adjudicable evidence in
    this dataset and must not be evaluated as a class (B10).
    DistriNet derives the two phases as running to 18:39 and 19:38, far past
    CIC's published 14:40 and 15:37, so even as declared these regions
    UNDER-cover the phase (A3). They are drawn at the published times because
    those are what the source states; the DistriNet finding is why the region
    cannot be read as an upper bound on the contamination. Widening them, or
    replacing them with real second-stage attack rules, is DEFERRED until
    sch.window_sweep has measured where this traffic actually stops in our own
    lake: the DistriNet end times are a third party's derivation and are recorded
    as the hypothesis that sweep should test, never as a transcribed fact.
    Scoped to the hosts CIC does name, so the rest of each day — which the
    schedule describes normally — stays adjudicated.
    These regions coincide with the four scheduled Infiltration windows by
    construction, so qtn.overlap_with_attack reports them: we are declining to
    adjudicate a span the schedule claims. That contradiction is real and this
    is its answer — the schedule's claim here amounts to 8 unfinished flows and
    accounts for none of the rest.

quarantine:
  - {reason: unlabellable-second-stage, justification: *second_stage,
     date: 2018-02-28, start: "10:50", end: "12:05",
     victim_ips: [172.31.69.24, 18.221.148.137]}
  - {reason: unlabellable-second-stage, justification: *second_stage,
     date: 2018-02-28, start: "13:42", end: "14:40",
