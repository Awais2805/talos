# CIC-IDS-2017 — ground-truth label manifest
# Transcribed 2026-07-26 from the official CIC dataset page (attack schedule,
# victim/attacker network tables). Times below are LOCAL wall-clock.
#
# !! utc_offset IS AN INFERENCE, NOT A TRANSCRIPTION. Verified 2026-07-30 against
# the CIC page and the ICISSP 2018 paper: neither states a timezone anywhere

dataset: cic-ids-2017
utc_offset: "-03:00"
capture_window: 2017-07-03 to 2017-07-07 (Mon benign-only)
match_default: [time, attacker, victim]

aliases:
  kali: &kali [205.174.165.73, 172.16.0.1]
  webserver: &webserver [192.168.10.50, 205.174.165.68]
  ubuntu12: &ubuntu12 [192.168.10.51, 205.174.165.66]

attacks:
  # ---- Tuesday 2017-07-04 ----
  - {name: FTP-Patator, date: 2017-07-04, start: "09:20", end: "10:20",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: SSH-Patator, date: 2017-07-04, start: "14:00", end: "15:00",
     attacker_ips: *kali, victim_ips: *webserver}

  # ---- Wednesday 2017-07-05 ----
  - {name: DoS-Slowloris,    date: 2017-07-05, start: "09:47", end: "10:10",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: DoS-Slowhttptest, date: 2017-07-05, start: "10:14", end: "10:35",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: DoS-Hulk,         date: 2017-07-05, start: "10:43", end: "11:00",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: DoS-GoldenEye,    date: 2017-07-05, start: "11:10", end: "11:23",
     attacker_ips: *kali, victim_ips: *webserver}
  # CIC's NAT chain for THIS attack reads "... -> 172.16.0.11 -> 192.168.10.51"
  # (.11, not the .1 used everywhere else). Almost certainly a typo — the reply
  # path in the same paragraph uses .1 — but both are listed so a post-NAT
  # capture matches either way. Time + victim still constrain the rule.
  - {name: Heartbleed, date: 2017-07-05, start: "15:12", end: "15:32",
     attacker_ips: [205.174.165.73, 172.16.0.1, 172.16.0.11],
     victim_ips: *ubuntu12, note: "port 444"}

  # ---- Thursday 2017-07-06 (morning: web attacks) ----
  - {name: WebAttack-BruteForce,    date: 2017-07-06, start: "09:20", end: "10:00",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: WebAttack-XSS,          date: 2017-07-06, start: "10:15", end: "10:35",
     attacker_ips: *kali, victim_ips: *webserver}
  - {name: WebAttack-SQLInjection, date: 2017-07-06, start: "10:40", end: "10:42",
     attacker_ips: *kali, victim_ips: *webserver}

  # ---- Thursday 2017-07-06 (afternoon: infiltration) ----
  - {name: Infiltration, date: 2017-07-06, start: "14:19", end: "14:35",
     attacker_ips: *kali, victim_ips: [192.168.10.8], note: "metasploit Win Vista"}
  - {name: Infiltration, date: 2017-07-06, start: "14:53", end: "15:00",
     attacker_ips: *kali, victim_ips: [192.168.10.25], note: "cool disk MAC"}
  - {name: Infiltration, date: 2017-07-06, start: "15:04", end: "15:45",
     attacker_ips: *kali, victim_ips: [192.168.10.8], note: "dropbox download Vista"}
  
  - {name: Infiltration-PortScan, date: 2017-07-06, start: "15:04", end: "15:45",
     attacker_ips: [192.168.10.8], victim_subnet: "192.168.10.0/24",
     note: "second step: infected Vista portscans the LAN"}

  # ---- Friday 2017-07-07 ----
  - {name: Botnet-ARES, date: 2017-07-07, start: "10:02", end: "11:02",
     attacker_ips: *kali,
     victim_ips: [192.168.10.15, 192.168.10.9, 192.168.10.14, 192.168.10.5, 192.168.10.8]}
  
  - {name: PortScan, date: 2017-07-07, start: "13:55", end: "14:36",
     attacker_ips: *kali, victim_ips: *webserver, note: "firewall rules on; coarse window"}
  # Firewall rules OFF sub-windows (nmap scan types sS..sI, b): 14:51 - 15:29
  - {name: PortScan, date: 2017-07-07, start: "14:51", end: "15:29",
     attacker_ips: *kali, victim_ips: *webserver, note: "firewall rules off; coarse window"}
  
  - {name: DDoS-LOIT, date: 2017-07-07, start: "15:56", end: "16:16",
     attacker_ips: [205.174.165.69, 205.174.165.70, 205.174.165.71, 172.16.0.1],
     victim_ips: *webserver}
