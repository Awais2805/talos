# Talos — labelling method `tabcl-v1`.
#
# Path B, contrastive branch. Values are Eslami & Hamouda Table VII, the
# self-generated/ISCX column, except where marked ADAPTED. Hashed with the label
# space, taxonomy, pools and feature set into `method_sha`.

name: tabcl-v1
implementation: tabcl

label_space: core-5
taxonomy: default

settings:
  pools: xdg-v3
  features: conn-v1
  vectoriser: passthrough

  # Encoder: Table VII gives 3 hidden layers (256, 128, 64), ReLU, dropout 0.10.
  # Latent 128 sits after a 64-wide layer in the paper; kept as published.
  latent_dim: 128
  hidden: [256, 128, 64]
  dropout: 0.10

  # Projection heads. Only the output dim is published; depth and width are not,
  # so the shipped MLPHead default (one hidden layer) applies.
  projection_dim: 128

  replace_rate: 0.15          # r, Eq. 4
  tau_cont: 0.5               # Eq. 7, continuous head
  tau_cat: 0.2                # Eq. 7, categorical head
  lam: 0.5                    # Eq. 11 mixing weight

  epochs: 100
  batch: 256
  lr: 0.0005
  refresh_every: 10

  # ADAPTED. The paper draws replacements from the exact class-conditional
  # marginal over the whole pool; at lake scale that is unstorable, so this is
  # the reservoir size per class the marginal is estimated from.
  reservoir: 4096

  # NOT PUBLISHED by the paper — freeze duration and fine-tuning epochs/LR are
  # listed as tuned but no value appears in any table. These are ours.
  freeze_epochs: 2
  finetune_epochs: 5

  seed: 0

  # cpu, not auto: cuda/mps/cpu are not bitwise identical under one seed, and a
  # declaration whose numbers get quoted has to name the device that made them.
  device: cpu
