# Talos — audit pool for the 2017-solo validation gate.
#
# `xdg` cannot serve this audit, for two reasons worth recording rather than
# silently overriding in place:
#
#   1. `xdg.d_s.share` is 0.0002 -- sized for the cross-domain study's 64.5M
#      row (2017+2018) pool, not for pulling a per-class floor out of 2017's
#      rarest class alone. 2017 botnet totals 736 flows; at 0.0002 share the
#      expected botnet count in d_s is ~0.15 -- i.e. never. DH.7's math
#      (floor / rarest_class_total ~= required share) is applied for real here.
#   2. `xdg.source.datasets` names BOTH cic-ids-2017 and cic-ids-2018. The
#      run under audit (DH.10/DH.11, "2017-solo") only ever produced a
#      `fused` labelled table for cic-ids-2017 -- pointing this partition at
#      2018 too would either pull in an unrelated 2018 sample or fail outright
#      reading a table that was never written.
#
# A new declaration, not an edit to xdg: xdg is the real cross-domain
# training pool and its shares are load-bearing for that study's provenance
# (pool_sha). Reusing it here would let an audit-sizing change silently move
# the training split underneath it.

name: 2017-audit
description: >
  Audit-only pool for validating the 2017-solo fused pseudo-labels by hand.
  Not used for pretraining or fine-tuning -- d_l/held exist here only because
  the partition schema requires shares to total 1, not because this study
  trains on them.

source:
  datasets: [cic-ids-2017]
  labels: fused          # the method actually under audit, not schedule

exclude:
  - out-of-space

# Rows no real flow could produce -- a negative byte count, IP bytes below the
# payload they carry, a near-zero duration dividing a real byte count into
# ~1e18 B/s. `talos validity` measures them per dataset; this is one rule for
# all of them, so 2018 is filtered exactly as 2017 is. Excluded from training,
# never deleted: the labelled table stays the whole dataset.
exclude_invalid: true

partition_by: uid
# Original literal kept on purpose: changing a seed re-derives every bucket.
seed: "talos-2017-audit-v1-20260816"
buckets: 1000000

# floor=50 needs share ~= 50/736 (2017's rarest core-5 class, botnet) ~= 0.068.
# Rounded up for a safety margin against an unlucky hash draw -- CandidateSelector
# reports a Shortfall rather than failing if it still comes up short, but padding
# costs nothing here (d_s isn't trained on, only read by a person).
# Raise --floor and this share together if a bigger sample is wanted; the ratio
# is what has to hold, not either number alone.
pools:
  d_s:
    share: 0.08
    role: audited
    description: >
      Candidates for hand adjudication of the 2017-solo fused run. Sized so
      botnet (736 flows total in 2017) can reach a floor of ~50.

  d_l:
    share: 0.77
    role: unlabelled
    description: >
      Unused by this audit. Present only to keep the partition's shares valid;
      not a claim that this is the right pretraining split for a real
      2017-only retrain.

  held:
    share: 0.15
    role: held
    description: Unused by this audit. Same reasoning as d_l.
