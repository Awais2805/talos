# Talos — labelling method `fused`. Reconciles the two behavioural branches.
#
# Version 2 (2026-08-18) — reads the consolidated `ae`/`tabcl` branches over
# conn features. History: docs/method-versions.md
#
# Eslami & Hamouda Eq. 17 reconciles the branches, then traffic-adapted
# confident learning (§IV-E) weighs every row. Reads the branches' written
# tables, so either can be re-run without re-running the other.

name: fused
implementation: fused

label_space: core-5
taxonomy: default

settings:
  # Exactly two, and ORDER MATTERS. Eq. 17 line 4 tests `m_first >= m_second`,
  # so the FIRST wins any exact tie; the second is taken only when it strictly
  # wins on confidence, or ties on confidence and strictly wins on margin.
  #
  # Expect MANY exact ties now that both branches are comparably trained --
  # which is the point, and it means the margin line, previously almost
  # unreachable, starts deciding rows. `talos label --method fused --explain`
  # counts exactly that.
  inputs: [ae, tabcl]

  features: conn-screened
  vectoriser: passthrough

  confident_learning: true

  # Eq. 18: folds, and the CV classifier from Table VII's CONFIDENT LEARNING
  # column -- not its Final Classifier column, which is a different component
  # (512/256/128) and belongs to Eq. 31's C_final, unimplemented here. These
  # probabilities must be out-of-sample: in-sample ones make every threshold
  # and every MAD optimistic.
  folds: 5
  hidden: [128, 64]
  dropout: 0.20
  lr: 0.001
  batch: 64
  epochs: 30

  q: 0.70        # Eq. 20 per-class quantile threshold
  gamma: 4.0     # Eq. 24 logistic slope
  w_min: 0.20    # Eq. 26 weight floor — nothing is ever dropped to zero

  # Eq. 28-30. ON for fidelity to the paper, but WATCH IT: it lifts any class
  # whose retained weight mass falls short of its estimated clean count. In the
  # paper's task the minority classes are coherent applications; here the
  # minority class is attack traffic, which is where pseudo-labels are least
  # reliable, and rho comes from the same model whose errors concentrate there.
  # The run report names every class it lifted.
  balanced_retention: true

  seed: 0
  device: cpu
