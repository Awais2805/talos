# FIXTURE-TESTED, NOT REAL-DATA EXECUTED.
#
# Generated against a small synthetic conn-shaped table (2000 rows, the
# same fixture tests/test_screen.py's `conn_like` uses), so this proves
# the screen -> annotate -> FeatureSetLoader -> active() wiring works, not
# that these are the real 2017/2018 verdicts or centre/scale values.
#
# Gate 3 (see docs/runbook-multi-dataset.md) OVERWRITES this exact file
# with a real run:
#   talos screen --dataset cic-ids-2017 [cic-ids-2018] --features conn \
#     --emit src/talos/data/feature/features/conn-screened.yaml
# after which method_sha moves and a re-run needs --force -- the intended
# staleness guard, not a fault.
#
# Talos -- feature set `conn-screened`. GENERATED by `talos screen`; edit
# the base declaration and re-run rather than editing this by hand.
#
# base        conn  sha e2b7339fe66c
#
# ANNOTATED, NOT PRUNED: every feature the base declares is still here.
# a `screen:` block below records this stage's verdict per feature;
# nothing is removed at this layer. A consumer -- a labelling method's
# vectoriser today, the training pipeline later -- calls
# `FeatureSet.active()` to apply its own policy over every stage's marks.
#
#   hist_flip              screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_ack          screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_orig_checksum     screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_data         screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_orig_fin          screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_orig_gap          screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_inconsistent screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_multiflag    screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_retransmit   screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_rst          screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_syn          screen=drop       100.00% of rows are '1', at or above the 99% limit
#   hist_orig_synack       screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_orig_zero_window  screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_resp_ack          screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_resp_checksum     screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_resp_data         screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_resp_fin          screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_resp_gap          screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_resp_inconsistent screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_resp_multiflag    screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_resp_retransmit   screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_resp_rst          screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_resp_syn          screen=drop       100.00% of rows are '0', at or above the 99% limit
#   hist_resp_synack       screen=drop       moves with history_len at 1.0000 (max); one representative is kept per cluster
#   hist_resp_zero_window  screen=drop       100.00% of rows are '0', at or above the 99% limit
#   local_orig             screen=drop       100.00% NULL, above the 50% limit, and no missingness indicator is declared fo
#   local_resp             screen=drop       100.00% NULL, above the 50% limit, and no missingness indicator is declared fo
#   missed_bytes           screen=drop       100.00% of rows are '0', at or above the 99% limit
#   orig_ip_bytes          screen=drop       moves with orig_bytes at 1.0000 (max); one representative is kept per cluster
#   overhead_orig          screen=drop       100.00% of rows are '40', at or above the 99% limit
#   resp_ip_bytes          screen=drop       moves with resp_bytes at 1.0000 (max); one representative is kept per cluster
name: conn-screened
description: 'Behavioural features over the Zeek conn backbone, shared by every domain.
  Volume, rate, direction, connection outcome and connection state history; no identity.

  '
numeric:
  duration:
    transform: log1p
    missing: 0.0
    indicator: true
    note: 'Zeek leaves this null for a connection with no observed teardown. The indicator
      matters: gate 5 had to distinguish orig_bytes = 0 (a connection attempt) from
      orig_bytes IS NULL (Zeek could not say), and the Engelen et al. attempted-attack
      criterion turns on exactly that.

      '
    centre: 4.577353
    scale: 1.038818
    screen:
      verdict: keep
  orig_bytes:
    transform: log1p
    missing: 0.0
    indicator: true
    centre: 6.603262
    scale: 0.991102
    screen:
      verdict: keep
  resp_bytes:
    transform: log1p
    missing: 0.0
    indicator: true
    centre: 7.893243
    scale: 1.044793
    screen:
      verdict: keep
  orig_pkts:
    transform: log1p
    missing: 0.0
    centre: 2.758016
    scale: 0.862406
    screen:
      verdict: keep
  resp_pkts:
    transform: log1p
    missing: 0.0
    centre: 3.059073
    scale: 0.889186
    screen:
      verdict: keep
  orig_ip_bytes:
    transform: log1p
    missing: 0.0
    centre: 6.700324
    scale: 0.826186
    screen:
      verdict: drop
      check: correlated
      reason: moves with orig_bytes at 1.0000 (max); one representative is kept per
        cluster
  resp_ip_bytes:
    transform: log1p
    missing: 0.0
    centre: 7.929002
    scale: 0.962572
    screen:
      verdict: drop
      check: correlated
      reason: moves with resp_bytes at 1.0000 (max); one representative is kept per
        cluster
  missed_bytes:
    transform: log1p
    missing: 0.0
    note: 'Capture loss, kept as a feature rather than only as a quality flag: heavy
      loss is itself characteristic of a flood.

      '
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
derived:
  orig_rate:
    expr: orig_bytes / nullif(duration, 0)
    transform: log1p
    missing: 0.0
    note: Bytes per second from the originator.
    centre: 2.218352
    scale: 1.084247
    screen:
      verdict: keep
  resp_rate:
    expr: resp_bytes / nullif(duration, 0)
    transform: log1p
    missing: 0.0
    centre: 3.411067
    scale: 1.290573
    screen:
      verdict: keep
  bytes_per_pkt_orig:
    expr: orig_bytes / nullif(orig_pkts, 0)
    transform: log1p
    missing: 0.0
    note: Payload shape. Separates a scan's empty SYNs from a real transfer.
    centre: 3.916993
    scale: 1.216385
    screen:
      verdict: keep
  bytes_per_pkt_resp:
    expr: resp_bytes / nullif(resp_pkts, 0)
    transform: log1p
    missing: 0.0
    centre: 4.874514
    scale: 1.313653
    screen:
      verdict: keep
  ratio_orig_resp:
    expr: (orig_bytes + 1.0) / (resp_bytes + 1.0)
    transform: log1p
    missing: 1.0
    note: 'Directional asymmetry. +1 on both sides so a silent responder is a large
      finite number rather than a division by zero.

      '
    centre: 0.343002
    scale: 0.451457
    screen:
      verdict: keep
  overhead_orig:
    expr: orig_ip_bytes - orig_bytes
    transform: log1p
    missing: 0.0
    note: 'Header bytes. High overhead with near-zero payload is the signature of
      a scan or a SYN flood. The validity screen refuses a negative value here rather
      than letting log1p clamp it to zero.

      '
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '40', at or above the 99% limit
  history_len:
    expr: coalesce(length(history), 0)
    note: How many state events the connection produced at all.
    centre: 6.8
    scale: 2.4
    screen:
      verdict: keep
  hist_orig_syn:
    expr: length(history) - length(replace(history, 'S', ''))
    note: "Originator SYN without an ACK \u2014 a bare scan probe looks like this."
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '1', at or above the 99% limit
  hist_resp_syn:
    expr: length(history) - length(replace(history, 's', ''))
    note: Responder SYN without an ACK.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_orig_synack:
    expr: length(history) - length(replace(history, 'H', ''))
    note: Originator SYN-ACK.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_synack:
    expr: length(history) - length(replace(history, 'h', ''))
    note: "Responder SYN-ACK \u2014 its absence is what makes a scan a scan."
    centre: 0.8
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_orig_ack:
    expr: length(history) - length(replace(history, 'A', ''))
    note: Originator pure ACK.
    centre: 0.8
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_resp_ack:
    expr: length(history) - length(replace(history, 'a', ''))
    note: Responder pure ACK.
    centre: 0.8
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_orig_data:
    expr: length(history) - length(replace(history, 'D', ''))
    note: "Originator payload \u2014 its absence is the attempted-attack signature."
    centre: 0.8
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_resp_data:
    expr: length(history) - length(replace(history, 'd', ''))
    note: Responder payload.
    centre: 0.8
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_orig_fin:
    expr: length(history) - length(replace(history, 'F', ''))
    note: Originator FIN, a clean close.
    centre: 0.8
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_resp_fin:
    expr: length(history) - length(replace(history, 'f', ''))
    note: Responder FIN.
    centre: 0.8
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_orig_rst:
    expr: length(history) - length(replace(history, 'R', ''))
    note: Originator RST, an abrupt close.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_rst:
    expr: length(history) - length(replace(history, 'r', ''))
    note: "Responder RST \u2014 Sr is 2017's dominant portscan pattern."
    centre: 0.2
    scale: 0.4
    screen:
      verdict: drop
      check: correlated
      reason: moves with history_len at 1.0000 (max); one representative is kept per
        cluster
  hist_orig_checksum:
    expr: length(history) - length(replace(history, 'C', ''))
    note: 'Originator bad checksum. Zeek is run with -C, so any count here contradicts
      the documented extraction and is a finding, not a feature.

      '
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_checksum:
    expr: length(history) - length(replace(history, 'c', ''))
    note: Responder bad checksum. Same contradiction as its uppercase twin.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_orig_gap:
    expr: length(history) - length(replace(history, 'G', ''))
    note: 'Originator content gap. A capture-loss artefact, so a strong candidate
      for the domain probe to reject.

      '
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_gap:
    expr: length(history) - length(replace(history, 'g', ''))
    note: Responder content gap. Same domain-leak risk.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_orig_retransmit:
    expr: length(history) - length(replace(history, 'T', ''))
    note: 'Originator retransmission. Reflects the capture network''s loss, not the
      attack, so the probe should be allowed to see and reject it.

      '
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_retransmit:
    expr: length(history) - length(replace(history, 't', ''))
    note: Responder retransmission. Same domain-leak risk.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_orig_zero_window:
    expr: length(history) - length(replace(history, 'W', ''))
    note: Originator advertised a zero window.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_zero_window:
    expr: length(history) - length(replace(history, 'w', ''))
    note: Responder advertised a zero window.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_orig_inconsistent:
    expr: length(history) - length(replace(history, 'I', ''))
    note: Originator inconsistent packet.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_inconsistent:
    expr: length(history) - length(replace(history, 'i', ''))
    note: Responder inconsistent packet.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_orig_multiflag:
    expr: length(history) - length(replace(history, 'Q', ''))
    note: Originator multi-flag packet.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_resp_multiflag:
    expr: length(history) - length(replace(history, 'q', ''))
    note: Responder multi-flag packet.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
  hist_flip:
    expr: length(history) - length(replace(history, '^', ''))
    note: Direction flipped mid-connection; Zeek reversed its view of the flow.
    screen:
      verdict: drop
      check: zero-variance
      reason: 100.00% of rows are '0', at or above the 99% limit
categorical:
  proto:
    values:
    - tcp
    - udp
    - icmp
    note: Zeek emits no others for these captures.
    screen:
      verdict: keep
  conn_state:
    values:
    - S0
    - S1
    - SF
    - REJ
    - S2
    - S3
    - RSTO
    - RSTR
    - RSTOS0
    - RSTRH
    - SH
    - SHR
    - OTH
    note: 'A coarser projection of the same information the history letters carry.
      Kept so the screen can measure whether it is redundant against them rather than
      the question being settled by assumption.

      '
    screen:
      verdict: keep
  local_orig:
    expr: CAST(local_orig AS VARCHAR)
    values:
    - 'true'
    - 'false'
    note: 'Direction relative to the monitored network. Carries no address. Dead if
      Site::local_nets was never set, which the screen decides on the measured dominant-value
      share rather than on belief.

      '
    screen:
      verdict: drop
      check: missingness
      reason: 100.00% NULL, above the 50% limit, and no missingness indicator is declared
        for it
  local_resp:
    expr: CAST(local_resp AS VARCHAR)
    values:
    - 'true'
    - 'false'
    screen:
      verdict: drop
      check: missingness
      reason: 100.00% NULL, above the 50% limit, and no missingness indicator is declared
        for it
constraints:
- name: orig_rate_definition
  form: ratio
  target: orig_rate
  operands:
  - orig_bytes
  - duration
- name: resp_rate_definition
  form: ratio
  target: resp_rate
  operands:
  - resp_bytes
  - duration
- name: orig_payload_shape
  form: ratio
  target: bytes_per_pkt_orig
  operands:
  - orig_bytes
  - orig_pkts
- name: resp_payload_shape
  form: ratio
  target: bytes_per_pkt_resp
  operands:
  - resp_bytes
  - resp_pkts
- name: orig_ip_bytes_decomposition
  form: sum
  target: orig_ip_bytes
  operands:
  - orig_bytes
  - overhead_orig
