# Talos — Tier 2 behavioural expectations
#
# Tier 0 asks whether the labelled zone is internally consistent, Tier 1 whether
# the attack windows match the published schedule. Neither reads a packet, so
# both pass a window that was transcribed perfectly and aimed at the wrong
# traffic. CSE-CIC-IDS2018's DoS-SlowHTTPTest window lands on port 21; its
# FTP-BruteForce class is 192,294 refused connections out of 192,300. This file
# is where the traffic itself gets a say.
#
# A band here is a falsifiable claim, not a filter: nothing is relabelled and
# nothing is dropped. A failure means either the labels are wrong or the band
# is, and the finding reports the measured rate beside the floor it missed so a
# reader can decide which.
#
# ---------------------------------------------------------------- schema ---
# classes:<canonical>        one entry per class in manifests/taxonomy.yaml
#   why:                     what the class is, in behavioural terms
#   min_flows:               below this the group is too thin to judge
#   ports:                   resp ports the class may plausibly target, read by
#                            beh.port_anomaly. null = legitimately diffuse
#   min_modal_share:         port_anomaly ignores a group whose modal port is
#                            below this share -- a scan has no single target to
#                            contradict
#   predicates: [{name, sql, min_pass, max_pass, requires, why}]
#     sql       a boolean expression over Zeek conn columns. It MUST be total --
#               coalesce every nullable column -- because a NULL counts as a
#               failed row, not as an abstention.
#     min_pass  share of the group's flows the expression must hold for
#     max_pass  ...and, optionally, must not exceed
#     requires  columns the expression needs. A predicate whose columns the zone
#               lacks is reported as unjudged, never counted as a pass.
#     name      also used as a SQL alias in the finding's repro, so keep it a
#               bare identifier
#   ratios: [{name, of, per, min, max, why}]
#     Structural claims no per-flow predicate can make -- fan-out, repetition.
#     `of` and `per` name group counters: flows, distinct_orig_h, distinct_resp_h,
#     distinct_orig_p, distinct_resp_p. The distinct counts are HyperLogLog
#     approximations, and where a class pools several raw attacks they are lower
#     bounds, so keep these bounds coarse.
#   signature: {all_of: [predicate names], max_benign_share: x}
#     The subset of predicates that together mean "this is that attack". Run
#     against the benign class by beh.benign_contamination. Only classes with a
#     genuinely distinctive shape declare one -- C2 traffic is built to look like
#     ordinary web traffic, so botnet deliberately has none.
#
# raw_overrides:<raw attack name>
#   The same keys, merged over the class entry, for attacks the class band
#   cannot describe. `dos` is the reason this exists: Hulk is fast, high-volume
#   and payload-carrying while Slowloris is long and near-silent, and no single
#   band is true of both. A raw attack with an override is judged on its own; the
#   rest of a class is judged together. The canonical class still comes from
#   taxonomy.yaml -- nothing here reassigns a class.
#
# Floors are calibrated against reports/eda/profile_*.json where a measurement
# exists, and marked PROVISIONAL where they are reasoned from how the attack
# works rather than measured. A provisional band failing is a question, not a
# verdict.

version: 1

defaults:
  benign_class: benign
  min_flows: 100
  min_modal_share: 0.30

# Anchors only. Nothing reads this key; it exists so the nine 2019 reflection
# vectors state the two things they share once instead of nine times.
common:
  udp_transport: &udp_transport
    name: udp_transport
    sql: >-
      coalesce(proto, '') = 'udp'
    min_pass: 0.90
    requires: [proto]
    why: >-
      Every 2019 reflection vector rides UDP by construction. TCP here means the
      window caught something other than the reflected flood.
  target_never_replies: &target_never_replies
    name: target_never_replies
    sql: >-
      coalesce(resp_pkts, 0) = 0
    min_pass: 0.75
    requires: [resp_pkts]
    why: >-
      The victim is a sink, not a participant. Measured at 0.962 conn_state S0
      across the whole 2019 ddos class.
  reflected_amplification: &reflected_amplification
    name: reflected_amplification
    sql: >-
      ("id.orig_p" IN (53, 123, 161, 1900, 389, 1434, 69, 137, 111)
        AND coalesce(orig_ip_bytes, 0) > 4 * coalesce(resp_ip_bytes, 0))
      OR ("id.resp_p" IN (53, 123, 161, 1900, 389, 1434, 69, 137, 111)
        AND coalesce(resp_ip_bytes, 0) > 4 * coalesce(orig_ip_bytes, 0))
    min_pass: 0.60
    requires: ["id.orig_p", "id.resp_p", orig_ip_bytes, resp_ip_bytes]
    why: >-
      Amplification is a claim about direction, so it is tested on whichever side
      carries the amplifier's service port. Written both ways deliberately -- the
      2019 captures are taken at the victim, where the reflector is the party
      that speaks first and the amplifier port lands in id.orig_p, but that is an
      inference from byte_ratio (median -3.04, i.e. the originator sends ~1000x
      what it receives) and not something the profile proves directly.
      PROVISIONAL.

classes:

  # ------------------------------------------------------------------ benign
  benign:
    why: >-
      Labelling is closed-world, so benign is a residue rather than an
      observation. These are negative expectations -- benign must not be
      dominated by an attack's shape. All four fail on cic-ddos-2019, whose
      benign class is 90% one-way UDP with no reply.
    ports: null
    predicates:
      - name: two_way_conversation
        sql: >-
          coalesce(resp_pkts, 0) > 0
        min_pass: 0.75
        requires: [resp_pkts]
        why: >-
          Ordinary traffic gets an answer. Measured 0.979 on 2017 and 0.915 on
          2018; 0.096 on 2019.
      - name: completes_or_resets
        sql: >-
          coalesce(conn_state, '') NOT IN ('S0', 'REJ', 'RSTOS0', 'SH', 'SHR')
        min_pass: 0.75
        requires: [conn_state]
        why: >-
          A benign class made of half-open and refused connections is a flood
          nobody labelled. Measured 0.974 on 2017, 0.904 on 2018, 0.099 on 2019.
      - name: service_identified
        sql: >-
          coalesce(service, '') <> ''
        min_pass: 0.55
        requires: [service]
        why: >-
          Zeek names the application protocol when it sees enough of one.
          Measured 0.947 on 2017, 0.862 on 2018, 0.075 on 2019 -- and a class
          Zeek cannot identify is a class nothing corroborates.
      - name: scan_shaped
        sql: >-
          coalesce(orig_bytes, 0) = 0 AND coalesce(duration, 0) < 1.0
          AND coalesce(orig_pkts, 0) <= 3
        max_pass: 0.25
        requires: [orig_bytes, duration, orig_pkts]
        why: >-
          A ceiling, not a floor. Some failed connections are normal background;
          a quarter of the class is a scan the schedule missed.

  # ---------------------------------------------------------------- portscan
  portscan:
    why: >-
      Reconnaissance -- touch a port, learn whether it answers, move on. The
      whole signal is in what the flows do NOT contain.
    ports: null
    min_modal_share: 0.50
    predicates:
      - name: half_open_or_refused
        sql: >-
          coalesce(conn_state, '') IN ('S0', 'REJ', 'RSTOS0')
        min_pass: 0.85
        requires: [conn_state]
        why: >-
          Measured 0.964 across the 2017 portscan class (REJ 0.831, S0 0.133).
      - name: subsecond
        sql: >-
          coalesce(duration, 0) < 1.0
        min_pass: 0.90
        requires: [duration]
        why: >-
          A probe is one round trip. 2017 p95 duration is 0.0001 s.
      - name: no_payload_sent
        sql: >-
          coalesce(orig_bytes, 0) = 0
        min_pass: 0.85
        requires: [orig_bytes]
        why: >-
          Measured 0.982 on 2017. A scan that sends application data is not a
          scan.
      - name: few_packets
        sql: >-
          coalesce(orig_pkts, 0) <= 4
        min_pass: 0.90
        requires: [orig_pkts]
        why: >-
          2017 p95 orig_pkts is 2.
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.80
        requires: [proto]
        why: >-
          Measured 0.985 on 2017. UDP scanning exists, hence the loose floor.
    ratios:
      - name: resp_ports_per_originator
        of: distinct_resp_p
        per: distinct_orig_h
        min: 20
        why: >-
          The defining structure: one source, many destination ports. A scan
          class with a handful of ports per source is a session, not a sweep.
    signature:
      all_of: [half_open_or_refused, subsecond, no_payload_sent, few_packets]
      max_benign_share: 0.15
      # 2018's benign class alone carries 3.68M unanswered SYNs (6.3%), which is
      # plausible background in a month of enterprise capture. The ceiling is set
      # above that on purpose and should be tightened once the first run gives a
      # real number rather than an estimate from the profile histograms.

  # --------------------------------------------------------------------- dos
  dos:
    why: >-
      Single-source denial of service against a web server. Every raw DoS name
      in the three manifests has its own override below, because the class spans
      Hulk (fast, loud, payload) and Slowloris (long, silent) -- this band is the
      fallback for a name we have not met.
    ports: [80, 443, 8080, 8000, 8888]
    predicates:
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          Measured 1.000 on both 2017 and 2018.
      - name: web_port
        sql: >-
          "id.resp_p" IN (80, 443, 8080, 8000, 8888)
        min_pass: 0.90
        requires: ["id.resp_p"]
        why: >-
          The 2017 dos class is 190,342 of 190,343 flows on port 80. The 2018
          class is 0.946 -- the missing 5.4% is 105,550 flows on port 21, which
          the per-attack override and beh.port_anomaly attribute by name.
      - name: bounded_duration
        sql: >-
          coalesce(duration, 0) < 3600
        min_pass: 0.95
        requires: [duration]
        why: >-
          Even slow-DoS sockets are minutes, not hours.
    ratios:
      - name: flows_per_source
        of: flows
        per: distinct_orig_h
        min: 100
        why: >-
          Single-source by definition, so the flow count per source host is what
          separates dos from ddos.

  # -------------------------------------------------------------------- ddos
  ddos:
    why: >-
      Distributed and reflected floods. The class band is a fallback -- LOIC,
      HOIC, SYN and the nine 2019 UDP reflection vectors each have an override,
      and they have almost nothing in common at flow level except that the
      target does not hold up its end of the conversation.
    ports: [80, 443, 8080, 53, 123, 161, 1900, 389, 1434, 69, 137, 111]
    predicates:
      - name: unanswered
        sql: >-
          coalesce(resp_pkts, 0) = 0
        min_pass: 0.50
        requires: [resp_pkts]
        why: >-
          Measured 0.962 across the 2019 ddos class. The floor is low because
          the 2017/2018 HTTP floods complete their sessions and are overridden
          below.
      - name: one_way_or_refused
        sql: >-
          coalesce(conn_state, '') IN ('S0', 'REJ', 'RSTOS0', 'SH', 'SHR', 'OTH')
        min_pass: 0.50
        requires: [conn_state]
        why: >-
          Measured 0.999 on 2019.
      - name: short_flow
        sql: >-
          coalesce(duration, 0) < 60
        min_pass: 0.80
        requires: [duration]
        why: >-
          2019 p95 duration is 3.0 s.
    ratios:
      - name: flows_per_target
        of: flows
        per: distinct_resp_h
        min: 1000
        why: >-
          A flood converges on a target. 2019 puts 71.8M flows on two victim
          addresses.
    signature:
      all_of: [unanswered, one_way_or_refused, short_flow]
      max_benign_share: 0.15
      # This is the expectation that surfaces cic-ddos-2019's benign class:
      # 90.4% of its "benign" flows have zero response packets and 90.0% are
      # conn_state S0, i.e. they are shaped exactly like the flood beside them.
      # 2017 sits near 0.02 and 2018 near 0.08.

  # ------------------------------------------------------------- brute_force
  brute_force:
    why: >-
      Credential guessing against a network service. Short authenticated
      sessions, repeated against one target, on the service's own port.
    ports: [21, 22]
    predicates:
      - name: auth_port
        sql: >-
          "id.resp_p" IN (21, 22)
        min_pass: 0.95
        requires: ["id.resp_p"]
        why: >-
          Measured 1.000 on both 2017 and 2018.
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          FTP and SSH are TCP.
      - name: short_session
        sql: >-
          coalesce(duration, 0) < 120
        min_pass: 0.90
        requires: [duration]
        why: >-
          One guess per connection. 2017 p95 is 13.4 s, 2018 p95 is 0.39 s.
      - name: small_payload
        sql: >-
          coalesce(orig_bytes, 0) < 65536
        min_pass: 0.95
        requires: [orig_bytes]
        why: >-
          A credential is small. 2017 max orig_bytes is 2,056 bytes.
      - name: refused
        sql: >-
          coalesce(conn_state, '') IN ('REJ', 'RSTOS0', 'S0')
        max_pass: 0.30
        requires: [conn_state]
        why: >-
          A ceiling. Guessing requires a session to guess in. 2017 measures
          0.000; 2018 measures 0.672, which is FTP-BruteForce being counted as
          an attack it never carried out.
    ratios:
      - name: attempts_per_target
        of: flows
        per: distinct_resp_h
        min: 50
        why: >-
          Brute force is repetition against one service.
    signature:
      all_of: [auth_port, tcp_transport, short_session, small_payload]
      max_benign_share: 0.05

  # -------------------------------------------------------------- web_attack
  web_attack:
    why: >-
      Attacks on a web application -- login brute force, XSS, SQL injection. The
      payload is the attack, so a web_attack flow that carries no payload is a
      connection attempt with an attack's name on it.
    ports: [80, 443, 8080]
    predicates:
      - name: web_port
        sql: >-
          "id.resp_p" IN (80, 443, 8080)
        min_pass: 0.95
        requires: ["id.resp_p"]
        why: >-
          Measured 1.000 on 2017 and 2018.
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          HTTP and TLS are TCP.
      - name: http_or_ssl_seen
        sql: >-
          coalesce(service, '') IN ('http', 'ssl')
        min_pass: 0.50
        requires: [service]
        why: >-
          Zeek's own opinion, independent of the byte count. Measured 0.977 on
          2018 but 0.088 on 2017 -- this band is expected to fail on 2017 and
          the failure is the finding, not a miscalibration.
      - name: empty_connection
        sql: >-
          coalesce(orig_bytes, 0) = 0
        max_pass: 0.25
        requires: [orig_bytes]
        why: >-
          A ceiling. Measured 0.911 on 2017, 0.023 on 2018. Engelen, Rimmer and
          Joosen (WTMC 2021) reported the same defect on the CICIDS2017 CSVs.
    ratios:
      - name: requests_per_target
        of: flows
        per: distinct_resp_h
        min: 5
        why: >-
          Web attacks are iterative against one application.

  # -------------------------------------------------------------- heartbleed
  heartbleed:
    why: >-
      OpenSSL heartbeat memory disclosure. One long TLS session in which the
      responder returns orders of magnitude more than it is sent -- that
      asymmetry IS the leak.
    ports: [444, 443]
    min_flows: 1
    # Deliberately 1. The 2017 heartbleed class is a single flow; that is the
    # dataset, not a sampling accident, and the expectation is still worth
    # asserting on it.
    predicates:
      - name: tls_port
        sql: >-
          "id.resp_p" IN (444, 443)
        min_pass: 0.90
        requires: ["id.resp_p"]
        why: >-
          CIC ran the vulnerable server on 444, not 443. Both are accepted so
          the band survives a dataset that used the standard port.
      - name: responder_returns_far_more
        sql: >-
          coalesce(resp_ip_bytes, 0) > 10 * coalesce(orig_ip_bytes, 0)
        min_pass: 0.60
        requires: [orig_ip_bytes, resp_ip_bytes]
        why: >-
          The 2017 flow returns 80.1 MB against 88 KB sent, a ratio of ~900.
      - name: long_lived
        sql: >-
          coalesce(duration, 0) >= 10
        min_pass: 0.50
        requires: [duration]
        why: >-
          Repeated heartbeats over one session. The 2017 flow runs 1,228 s.

  # ------------------------------------------------------------ infiltration
  infiltration:
    why: >-
      Exploitation followed by inside-out activity. There is no canonical port
      and no canonical shape, so the only defensible claim is that something
      actually happened on the connection.
    ports: null
    min_flows: 5
    predicates:
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.90
        requires: [proto]
        why: >-
          Measured 1.000 on 2017 and 2018.
      - name: connection_did_something
        sql: >-
          coalesce(orig_bytes, 0) > 0 OR coalesce(resp_bytes, 0) > 0
          OR coalesce(duration, 0) >= 1.0
        min_pass: 0.50
        requires: [orig_bytes, resp_bytes, duration]
        why: >-
          The 2017 infiltration class is 25 flows of which 19 are conn_state REJ
          with zero bytes, so this measures ~0.24 and fires. A backdoor that was
          refused is not an infiltration.

  # ------------------------------------------------------------------ botnet
  botnet:
    why: >-
      C2 traffic between infected hosts and one controller. Short, repetitive,
      small, and on the controller's port. No signature is declared -- C2 is
      built to look like ordinary web traffic, and any signature broad enough to
      catch it would match a third of a normal benign class.
    ports: [8080, 80, 443, 6667]
    predicates:
      - name: controller_port
        sql: >-
          "id.resp_p" IN (8080, 80, 443, 6667)
        min_pass: 0.90
        requires: ["id.resp_p"]
        why: >-
          Measured 1.000 on port 8080 for both the 2017 ARES and the 2018 Bot
          classes. 6667 is there for IRC-era C2 in other datasets.
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          Measured 1.000 on 2017 and 2018.
      - name: short_beacon
        sql: >-
          coalesce(duration, 0) < 60
        min_pass: 0.80
        requires: [duration]
        why: >-
          Check in, take orders, hang up. 2017 p95 is 0.22 s, 2018 p95 0.019 s.
      - name: payload_sent
        sql: >-
          coalesce(orig_bytes, 0) > 0
        min_pass: 0.85
        requires: [orig_bytes]
        why: >-
          A beacon carries a beacon. Measured 1.000 on 2017, 0.997 on 2018.
    ratios:
      - name: flows_per_controller
        of: flows
        per: distinct_resp_h
        min: 20
        why: >-
          The defining structure -- many connections converging on one
          controller. 2017 puts 736 flows on a single address.

# ============================================================ raw overrides ==

raw_overrides:

  # ---- 2017 / 2018 DoS ------------------------------------------------------
  # Hulk and GoldenEye flood a web server with complete, payload-carrying
  # requests. Slowloris and SlowHTTPTest do the opposite: hold sockets open and
  # send almost nothing. One band cannot be true of both, which is why this
  # section exists.
  DoS-Hulk: &dos_fast
    ports: [80, 443, 8080]
    predicates:
      - name: http_service
        sql: >-
          coalesce(service, '') = 'http'
        min_pass: 0.80
        requires: [service]
        why: >-
          The 2017 dos class measures 0.875 and the 2018 class 0.943 with the
          slow variants included, so Hulk alone should sit well above this.
      - name: web_port
        sql: >-
          "id.resp_p" IN (80, 443, 8080)
        min_pass: 0.95
        requires: ["id.resp_p"]
        why: >-
          A flood aimed anywhere else is not this attack.
      - name: payload_sent
        sql: >-
          coalesce(orig_bytes, 0) > 0
        min_pass: 0.85
        requires: [orig_bytes]
        why: >-
          Hulk's mechanism is the request itself, and taxonomy.yaml lists it
          under requires_payload for the same reason.
      - name: short_lived
        sql: >-
          coalesce(duration, 0) < 60
        min_pass: 0.90
        requires: [duration]
        why: >-
          Fire and forget. The 2017 dos class p95 is 11.5 s.
  DoS-GoldenEye: *dos_fast

  DoS-Slowloris: &dos_slow
    ports: [80, 443, 8080]
    predicates:
      - name: web_port
        sql: >-
          "id.resp_p" IN (80, 443, 8080)
        min_pass: 0.90
        requires: ["id.resp_p"]
        why: >-
          The whole point of the attack is to exhaust a web server's connection
          pool. A slow-DoS window whose traffic is on another port is a window
          over the wrong traffic -- this is the band that fails on 2018, where
          105,550 flows in the dos class sit on port 21.
      - name: tiny_payload
        sql: >-
          coalesce(orig_bytes, 0) < 4096
        min_pass: 0.85
        requires: [orig_bytes]
        why: >-
          Partial headers, dripped. Never a full request.
      - name: few_packets
        sql: >-
          coalesce(orig_pkts, 0) <= 20
        min_pass: 0.70
        requires: [orig_pkts]
        why: >-
          The socket is held, not fed. PROVISIONAL -- the profile pools the slow
          and fast DoS variants, so this is reasoned rather than measured.
      - name: held_open
        sql: >-
          coalesce(duration, 0) >= 5.0
        min_pass: 0.40
        requires: [duration]
        why: >-
          PROVISIONAL, and the floor is deliberately low. Slow-DoS connections
          that are still open when the capture ends are logged by Zeek with a
          truncated duration, so this cannot be asserted strongly.
  DoS-Slowhttptest: *dos_slow      # 2017 spelling
  DoS-SlowHTTPTest: *dos_slow      # 2018 spelling

  # ---- 2017 / 2018 volumetric DDoS -----------------------------------------
  DDoS-LOIT: &ddos_http_flood
    ports: [80, 443, 8080]
    predicates:
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          Measured 1.000 on the 2017 and 2018 ddos classes.
      - name: web_port
        sql: >-
          "id.resp_p" IN (80, 443, 8080)
        min_pass: 0.95
        requires: ["id.resp_p"]
        why: >-
          Both classes are 100% port 80.
      - name: http_service
        sql: >-
          coalesce(service, '') = 'http'
        min_pass: 0.85
        requires: [service]
        why: >-
          Measured 0.994 on 2017 and 0.999 on 2018.
      - name: payload_sent
        sql: >-
          coalesce(orig_bytes, 0) > 0
        min_pass: 0.90
        requires: [orig_bytes]
        why: >-
          These tools send real requests. 2017 measures orig_bytes = 20 on every
          single flow.
  DDoS-LOIC-HTTP: *ddos_http_flood
  DDoS-HOIC: *ddos_http_flood
  WebDDoS: *ddos_http_flood

  DDoS-LOIC-UDP:
    ports: null
    min_flows: 50
    predicates:
      - *udp_transport
      - name: short_flow
        sql: >-
          coalesce(duration, 0) < 60
        min_pass: 0.80
        requires: [duration]
        why: >-
          A packet blast, not a session.

  # ---- 2019 direct floods ---------------------------------------------------
  SYN:
    ports: [80, 443]
    predicates:
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          A SYN flood is TCP or it is nothing.
      - name: half_open
        sql: >-
          coalesce(conn_state, '') IN ('S0', 'REJ', 'RSTOS0')
        min_pass: 0.85
        requires: [conn_state]
        why: >-
          The handshake is never completed. The 2019 ddos class carries 6.50M
          history='S' and 2.66M history='Sr' flows, which is exactly this.
      - name: history_starts_with_syn
        sql: >-
          coalesce(history, '') LIKE 'S%' OR coalesce(history, '') LIKE '^S%'
        min_pass: 0.85
        requires: [history]
        why: >-
          Zeek writes the originator's SYN as a leading 'S'. The '^' variant is
          a connection Zeek saw flipped and is accepted rather than counted
          against the band.

  UDP: &udp_flood
    ports: null
    predicates:
      - *udp_transport
      - *target_never_replies
      - name: few_packets
        sql: >-
          coalesce(orig_pkts, 0) <= 20
        min_pass: 0.70
        requires: [orig_pkts]
        why: >-
          2019 median orig_pkts is 2 across the whole ddos class. PROVISIONAL
          for this vector alone.
  UDP-Lag: *udp_flood

  # ---- 2019 reflection / amplification vectors ------------------------------
  # Each names the amplifier's own service port. The port is tested on both
  # sides of the flow, so the band does not depend on which end Zeek decided was
  # the originator.
  DNS:
    ports: [53]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_dns
        sql: >-
          "id.orig_p" = 53 OR "id.resp_p" = 53
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. Reflected DNS responses carry port 53 on the reflector's
          side.

  NTP:
    ports: [123]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_ntp
        sql: >-
          "id.orig_p" = 123 OR "id.resp_p" = 123
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. NTP monlist reflection is port 123.

  SNMP:
    ports: [161]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_snmp
        sql: >-
          "id.orig_p" = 161 OR "id.resp_p" = 161
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. SNMP GetBulk reflection is port 161.

  SSDP:
    ports: [1900]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_ssdp
        sql: >-
          "id.orig_p" = 1900 OR "id.resp_p" = 1900
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. SSDP M-SEARCH reflection is port 1900.

  LDAP:
    ports: [389]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_ldap
        sql: >-
          "id.orig_p" = 389 OR "id.resp_p" = 389
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. CLDAP reflection is UDP 389.

  MSSQL:
    ports: [1434]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_mssql
        sql: >-
          "id.orig_p" = 1434 OR "id.resp_p" = 1434
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. The reflected service is the SQL Server Browser on UDP
          1434, not the 1433 data port.

  TFTP:
    ports: [69]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_tftp
        sql: >-
          "id.orig_p" = 69 OR "id.resp_p" = 69
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. TFTP read-request reflection is port 69. Note that TFTP
          moves to an ephemeral port after the first datagram, so a lower
          measured rate here may be protocol behaviour rather than mislabelling.

  NetBIOS:
    ports: [137, 138, 139]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_netbios
        sql: >-
          "id.orig_p" IN (137, 138) OR "id.resp_p" IN (137, 138)
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. NBNS name-service reflection is UDP 137.

  PortMap:
    ports: [111]
    predicates:
      - *udp_transport
      - *target_never_replies
      - *reflected_amplification
      - name: amplifier_port_portmap
        sql: >-
          "id.orig_p" = 111 OR "id.resp_p" = 111
        min_pass: 0.70
        requires: ["id.orig_p", "id.resp_p"]
        why: >-
          PROVISIONAL. RPC portmapper reflection is port 111.

  # ---- brute force, split by service ---------------------------------------
  # Separated from the class band only so beh.port_anomaly can catch a window
  # named for one service that landed on another.
  FTP-Patator: &ftp_brute
    ports: [21]
    predicates:
      - name: ftp_port
        sql: >-
          "id.resp_p" = 21
        min_pass: 0.95
        requires: ["id.resp_p"]
        why: >-
          Measured as the modal port of the 2017 and 2018 brute_force classes.
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          FTP is TCP.
      - name: refused
        sql: >-
          coalesce(conn_state, '') IN ('REJ', 'RSTOS0', 'S0')
        max_pass: 0.30
        requires: [conn_state]
        why: >-
          A ceiling, and the one that fails on 2018 FTP-BruteForce, where
          192,294 of 192,300 flows never got a session to guess in.
      - name: small_payload
        sql: >-
          coalesce(orig_bytes, 0) < 65536
        min_pass: 0.95
        requires: [orig_bytes]
        why: >-
          Credentials are small.
  FTP-BruteForce: *ftp_brute

  SSH-Patator: &ssh_brute
    ports: [22]
    predicates:
      - name: ssh_port
        sql: >-
          "id.resp_p" = 22
        min_pass: 0.95
        requires: ["id.resp_p"]
        why: >-
          The 2017 brute_force class measures service=ssh at 0.387 and the 2018
          class at 0.328, in both cases entirely on port 22.
      - name: tcp_transport
        sql: >-
          coalesce(proto, '') = 'tcp'
        min_pass: 0.95
        requires: [proto]
        why: >-
          SSH is TCP.
      - name: short_session
        sql: >-
          coalesce(duration, 0) < 120
        min_pass: 0.90
        requires: [duration]
        why: >-
          One authentication attempt per connection.
      - name: small_payload
        sql: >-
          coalesce(orig_bytes, 0) < 65536
        min_pass: 0.95
        requires: [orig_bytes]
        why: >-
          A key exchange and a guess, nothing more.
  SSH-Bruteforce: *ssh_brute
