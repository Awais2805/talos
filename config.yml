# Talos — central configuration.
#
# Everything that decides WHERE data lives is here; no script carries its own
# bucket name or prefix. Point lake.root at a local directory, an S3 bucket, GCS
# or anything else fsspec reaches, and the whole pipeline follows.
# `talos config` shows how it resolves.
#
# What is NOT here: dataset roles. Whether a dataset may contribute to a
# training pool is a property of an experiment, not of the lake, so it lives in
# experiments/<name>/experiment.yaml and is hashed into experiment_sha beside
# the result it produced.

lake:
  # Local directory, s3://bucket/prefix, gs://…, abfs://… — one code path.
  # `talos init <root>` creates the layout wherever this points.
  root: "/lake"

  # zones: is an OVERRIDE for a lake whose layout Talos did not create. Omitted
  # here, so the standard source-major layout applies:
  #
  #   sources/{source}/raw/{dataset}
  #   sources/{source}/extracted/{feature_space}/{dataset}
  #   sources/{source}/parquet/{feature_space}/{dataset}
  #   sources/{source}/labelled/{feature_space}/{dataset}
  #   canonical/{schema_version}/{dataset}          <- shared across sources

# What this machine may spend. Every value defaults to `auto`, detected at run
# time, and `talos config` shows what was detected. Declare a value to pin it —
# useful when the machine is shared, or when you know which disk is the big one.
#
#   memory_limit  75% of physical RAM
#   threads       cores, capped so each has at least 512 MB to work in
#   temp_dir      the roomiest volume, NEVER left to default onto the root disk
#   max_temp      min(20GB, a quarter of that volume's free space)
resources:
  memory_limit: auto
  threads: auto
  temp_dir: auto
  max_temp: auto

reports:
  dir: "reports"

# Which plugins this project uses. `talos config` shows what is registered.
extractor: zeek
model: xgboost

# Bring your own. Keyed by plug-in point, so a directory of manifests is never
# searched for experiments. `talos config` lists every point and what it holds.
#
#   .py points  (a file, or a directory of them)  extractor, and later:
#                                                 labelling method, encoder, model
#   .yaml points (a directory of declarations)    manifest, experiment
#
# Yours is searched BEFORE the shipped one, so it wins -- and every run reports
# the origin of what it resolved, so a substitution is never silent.
#
# plugins:
#   extractor: ["~/talos-plugins/nprobe.py"]
#   manifest:  ["~/talos-plugins/manifests"]

# Only consulted when lake.root is a remote URI.
aws:
  region: eu-north-1

# What is in the lake, and where each dataset's traffic came from.
#
# source decides which labelling is even applicable, not just where files sit:
#   datasets  -- public IDS corpora, labelled from a published attack schedule
#   netem     -- emulator runs, labels known by construction
#   honeypot  -- live capture, no schedule; behavioural labelling only
datasets:
  cic-ids-2017:
    source: datasets
  cic-ids-2018:
    source: datasets
  cic-ddos-2019:
    source: datasets

zeek:
  image: zeek/zeek:8.2.1        # pin the tag; `latest` is refused as a version
  flags: "-C"                   # ignore invalid TCP checksums
  json_logs: true
  scripts: []
  # version: 8.2.1              # only needed if the image tag is not a version
