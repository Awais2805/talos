[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talos"
version = "0.1.0"
description = "A research platform for cross-domain network intrusion detection"
readme = "README.md"
requires-python = ">=3.10"

# Core dependencies used by the Talos platform itself.
# Keep this list small: optional deployment/model capabilities
# belong in the extras below.
dependencies = [
    "duckdb>=1.1",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

# Required when lake.root points at an S3 URI.
s3 = [
    "s3fs>=2024.6",
    "fsspec>=2024.6",
]

# Machine-learning model support.
model = [
    "xgboost>=2.1",
    "scikit-learn>=1.5",
]

# PyTorch support. Kept separate because PyTorch is large
# and may have platform/CUDA-specific installation concerns.
torch = [
    "torch>=2.2; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]

# Cleanlab-based labelling support.
cl = [
    "cleanlab>=2.6",
    "scikit-learn>=1.5",
]

# Developer/test dependencies.
dev = [
    "pytest>=8.0",
]

[project.scripts]
talos = "talos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"talos.data.profiling.eda" = ["spec.yaml"]
"talos.data.feature" = ["features/*.yaml"]
"talos.data.labelling" = ["taxonomies/*.yaml", "spaces/*.yaml"]
"talos.data.labelling.schedule" = ["manifests/*.yaml", "method.yaml"]
"talos.data.labelling.behavioural" = ["pools/*.yaml", "*/method.yaml"]
"talos.data.labelling.fusion" = ["*/method.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]